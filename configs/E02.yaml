experiment_id: E02
description: 切块参数结论：chunk_size=512 / overlap=80（对照 E02_256/512 探索跑，选出最优）
dataset: data/golden/cases.jsonl
suite_split: all
k: 5
system:
  chunk_size: 512
  chunk_overlap: 80
  embed_provider: hashing
  embed_dim: 1024
  top_k: 5
  min_relevance: 0.0
  generator: extractive
  max_context_chunks: 5
gates:
  recall@5:
    min_delta: 0.0                 # 主指标：召回不得回退（本配置较 E00 提升 +0.037）
  mrr@5:
    max_delta: -0.01               # 护栏：排序不得明显回退
  ndcg@5:
    max_delta: -0.01               # 护栏：排序质量不得明显回退
  p95_latency_ms:
    max: 500.0                     # 护栏：离线链路延迟上限
